<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sample security research methods certificate</title>
  <desc id="desc">A dark circuit-board inspired workshop certificate clearly labeled as a demonstration sample.</desc>
  <defs>
    <pattern id="pixels" width="32" height="32" patternUnits="userSpaceOnUse">
      <rect width="2" height="2" fill="#b9ff66" fill-opacity=".13"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="760" fill="#050706"/>
  <rect x="20" y="20" width="1160" height="720" fill="url(#pixels)" stroke="#354638" stroke-width="2"/>
  <rect x="44" y="44" width="1112" height="672" fill="#050706" fill-opacity=".84" stroke="#526353"/>

  <g fill="none" stroke="#354638" stroke-width="3">
    <path d="M44 150h110l30 30h116M44 610h125l28-28h103M900 180h115l28-28h113M900 582h116l28 28h112"/>
    <circle cx="300" cy="180" r="7" fill="#b9ff66" stroke="none"/>
    <circle cx="300" cy="582" r="7" fill="#f3cb55" stroke="none"/>
    <circle cx="900" cy="180" r="7" fill="#b9ff66" stroke="none"/>
    <circle cx="900" cy="582" r="7" fill="#f3cb55" stroke="none"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace">
    <text x="76" y="90" fill="#b9ff66" font-size="17" letter-spacing="4">WORKSHOP RECORD // 04</text>
    <text x="1124" y="90" fill="#f3cb55" font-size="14" text-anchor="end">DEMONSTRATION ONLY</text>

    <g transform="translate(76 196)">
      <rect width="18" height="18" fill="#b9ff66"/><rect x="26" width="18" height="18" fill="#526353"/>
      <rect y="26" width="18" height="18" fill="#526353"/><rect x="26" y="26" width="18" height="18" fill="#f3cb55"/>
      <path d="M62 9H190M62 35H150" stroke="#354638" stroke-width="3"/>
    </g>

    <text x="76" y="314" fill="#7b8e7e" font-size="16" letter-spacing="5">SAMPLE CERTIFICATE</text>
    <text x="76" y="382" fill="#e7f1e8" font-size="51" font-weight="800">SECURITY RESEARCH</text>
    <text x="76" y="434" fill="#b9ff66" font-size="31" font-weight="700">METHODS WORKSHOP</text>
    <text x="76" y="496" fill="#9bad9e" font-size="16">A fictional completion record for portfolio layout testing.</text>

    <g transform="translate(825 310)">
      <circle r="138" fill="#071008" stroke="#354638" stroke-width="3"/>
      <circle r="104" fill="none" stroke="#b9ff66" stroke-width="3" stroke-dasharray="4 12" filter="url(#softGlow)"/>
      <circle r="68" fill="none" stroke="#526353" stroke-width="8"/>
      <path d="M-38 0H38M0-38V38" stroke="#e7f1e8" stroke-width="8"/>
      <rect x="-12" y="-12" width="24" height="24" fill="#f3cb55"/>
      <text y="184" fill="#b9ff66" font-size="14" text-anchor="middle" letter-spacing="4">SAMPLE MARK</text>
    </g>

    <rect x="76" y="558" width="722" height="90" fill="#071008" stroke="#354638"/>
    <text x="100" y="591" fill="#526353" font-size="12" letter-spacing="3">RECIPIENT</text>
    <text x="100" y="624" fill="#e7f1e8" font-size="23">PORTFOLIO PLACEHOLDER</text>
    <text x="774" y="591" fill="#526353" font-size="12" text-anchor="end">REFERENCE</text>
    <text x="774" y="624" fill="#b9ff66" font-size="15" text-anchor="end">SAMPLE-0004</text>

    <path d="M842 558H1124V648H842" fill="#071008" stroke="#354638"/>
    <text x="983" y="591" fill="#f3cb55" font-size="14" text-anchor="middle" letter-spacing="2">NOT A REAL</text>
    <text x="983" y="624" fill="#f3cb55" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="3">CREDENTIAL</text>
    <text x="1124" y="686" fill="#526353" font-size="12" text-anchor="end">NO ISSUER // NO EXPIRY // NO VALIDATION</text>
  </g>

  <text x="588" y="416" fill="#e7f1e8" fill-opacity=".028" font-family="ui-monospace, Consolas, monospace" font-size="150" font-weight="900" text-anchor="middle" transform="rotate(-15 588 416)">SAMPLE</text>
</svg>
